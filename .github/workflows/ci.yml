name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e-local:
    runs-on: ubuntu-latest
    needs: build-and-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (app + playwright)
        run: |
          npm ci
          npx playwright install chromium --with-deps
      # E2E déterministe : local uniquement (vite preview), JAMAIS contre Vercel/live
      # (le parcours démo écrit en base ; les runs Vercel sont manuels via E2E_TARGET=vercel).
      - name: E2E (local preview)
        run: npx playwright test --project=local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
