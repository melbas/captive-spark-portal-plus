name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (vite build)
        run: npm run build
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      # TODO: rendre le lint bloquant une fois les ~83 problèmes préexistants
      # (dont 68 erreurs) corrigés. Non bloquant pour garder la CI verte sur la
      # baseline actuelle.
      - name: Lint (non bloquant — dette préexistante)
        run: npx eslint .
        continue-on-error: true
      - name: Unit tests (vitest, suite filtrée)
        run: npm run test:ci
      # TODO: e2e Playwright — @playwright/test est installé (playwright.config.ts
      # présent) mais l'e2e n'est pas encore fiable sur la baseline. Réactiver un
      # job `e2e-local` (npm ci + npx playwright install chromium --with-deps +
      # npx playwright test --project=local) une fois les specs stabilisées.
