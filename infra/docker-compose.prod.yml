version: '3.9'

# ─── PremiumConnect — Production Stack ────────────────────────────────────────
# Déploiement: docker compose -f infra/docker-compose.prod.yml up -d
# Prérequis: créer un fichier .env.prod à la racine du projet

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pc_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-premiumconnect}
      POSTGRES_USER: ${POSTGRES_USER:-pc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [pc_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pc_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pc_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [pc_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Core (Fastify + tRPC) ─────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: pc_api_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WAVE_API_KEY: ${WAVE_API_KEY}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET}
      ORANGE_MONEY_API_KEY: ${ORANGE_MONEY_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [pc_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Service IA (Python FastAPI) ───────────────────────────────────────────────
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: pc_ai_prod
    restart: always
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_SERVICE_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pc_net]

  # ── Portail Captif (React — servi par Nginx) ──────────────────────────────────
  portal:
    build:
      context: ../apps/portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PORTAL_API_URL:-https://api.premiumconnect.sn}
    container_name: pc_portal_prod
    restart: always
    networks: [pc_net]

  # ── Back-Office (React — servi par Nginx) ─────────────────────────────────────
  backoffice:
    build:
      context: ../apps/backoffice
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKOFFICE_API_URL:-https://api.premiumconnect.sn}
    container_name: pc_backoffice_prod
    restart: always
    networks: [pc_net]

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pc_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on: [api, portal, backoffice]
    networks: [pc_net]

  # ── Certbot (SSL auto-renouvellement) ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: pc_certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN} -d api.${DOMAIN} -d admin.${DOMAIN}

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  pc_net:
    driver: bridge
